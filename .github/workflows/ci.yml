name: Kontrola
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck a build (beta)
        run: npm run build -- --base=/questwave/
        env:
          VITE_LOCAL: '1'
      - name: Build dema
        run: npm run build:demo
