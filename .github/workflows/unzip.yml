name: Unzip upload
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip file found"; exit 1; fi
          for z in "${zips[@]}"; do unzip -oq "$z"; rm "$z"; done
          if [ -d questwave ]; then cp -r questwave/. . ; rm -rf questwave; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Questwave first version"
          git push
